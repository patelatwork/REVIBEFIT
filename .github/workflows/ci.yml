name: RevibeFit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_mode:
        description: "Run mode for demo (normal or intentional-fail)"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - intentional-fail

# Cancel superseded runs on the same branch/PR, but never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Backend: install, test, coverage artifact ──────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RevibeFit-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: RevibeFit-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Tests mock ioredis/mongoose — no DB or Redis service needed.
      # JWT_SECRET is required by auth code paths even when mocked.
      - name: Run tests with coverage
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.demo_mode != 'intentional-fail' }}
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
        run: npm run test:coverage

      - name: Run intentional fail demo test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo_mode == 'intentional-fail' }}
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
        run: npm run test:demo:fail

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: RevibeFit-Backend/coverage/
          retention-days: 14

  # ── Frontend: install + build only (lint excluded until codebase is clean) ──
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RevibeFit-Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: RevibeFit-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vite inlines VITE_API_URL at build time. Use /api so the bundle
      # works behind the nginx reverse proxy defined in docker-compose.
      - name: Build
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload built assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: RevibeFit-Frontend/dist/
          retention-days: 7

  # ── Docker build validation (runs only after tests + build pass) ──
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx (enables GHA layer cache)
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./RevibeFit-Backend
          push: false
          tags: revibe-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./RevibeFit-Frontend
          push: false
          tags: revibe-frontend:ci
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
